<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="AI receptionist for Maple Street Dog Grooming." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Maple Street Receptionist</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main class="workspace">
			<aside class="sidebar-panel" aria-labelledby="sidebar-title">
				<div class="business-mark" aria-hidden="true">
					<svg viewBox="0 0 48 48" role="img" aria-label="Paw print">
						<circle cx="15" cy="15" r="5" />
						<circle cx="33" cy="15" r="5" />
						<circle cx="10" cy="25" r="4.5" />
						<circle cx="38" cy="25" r="4.5" />
						<path
							d="M24 22c-6.2 0-11 4.7-11 10.1C13 37.1 17.9 40 24 40s11-2.9 11-7.9C35 26.7 30.2 22 24 22Z"
						/>
					</svg>
				</div>
				<div>
					<h1 id="sidebar-title">Maple Street<br />Receptionist</h1>
				</div>

				<button id="new-conversation" class="secondary-button" type="button">
					Start new conversation
				</button>
				<button id="end-conversation" class="secondary-button" type="button" disabled>
					End conversation
				</button>

				<section class="voice-demo" aria-labelledby="voice-demo-title">
					<p id="voice-demo-title" class="scenario-group-label">Live voice</p>
					<p id="livekit-status" class="voice-status" aria-live="polite">Not connected</p>
					<div class="voice-actions">
						<button id="start-livekit-voice" class="voice-button" type="button">
							Start voice
						</button>
						<button id="stop-livekit-voice" class="voice-button" type="button" disabled>
							Stop voice
						</button>
					</div>
					<div id="livekit-audio" class="voice-audio" aria-live="polite"></div>
				</section>

				<div class="scenario-list" id="scenario-list">
					<p class="field-label">Quick requests</p>

					<div class="scenario-group">
						<p class="scenario-group-label">Information</p>
						<button type="button" data-prompt="What grooming services do you offer?">
							Services
						</button>
						<button
							type="button"
							data-prompt="What is the starting price for a full groom for a 50-pound dog?"
						>
							Pricing
						</button>
						<button type="button" data-prompt="Are you open on Sunday?">Hours</button>
						<button
							type="button"
							data-prompt="Can you groom my 80-pound golden retriever? He is healthy and calm."
						>
							Suitability
						</button>
						<button
							type="button"
							data-prompt="Do I need current rabies vaccination proof for my dog?"
						>
							Vaccination
						</button>
					</div>

					<div class="scenario-group">
						<p class="scenario-group-label">Appointments</p>
						<button
							type="button"
							data-prompt="I want to book a bath for Max next Saturday at 10:00 AM. My name is Hemant, my phone is +919876543210, Max weighs 50 pounds, and his rabies vaccination is current."
						>
							Book
						</button>
						<button
							type="button"
							data-prompt="I need to reschedule Max's appointment. My name is Hemant and my contact phone is +919876543210. Can I move it to next Saturday at 11:00 AM?"
						>
							Reschedule
						</button>
						<button
							type="button"
							data-prompt="I want to cancel Max's appointment. My name is Hemant and my contact phone is +919876543210."
						>
							Cancel
						</button>
						<button
							type="button"
							data-prompt="I am running 10 minutes late for Max's appointment. My name is Hemant and my contact phone is +919876543210."
						>
							10 minutes late
						</button>
						<button
							type="button"
							data-prompt="I am running 20 minutes late for Max's appointment. My name is Hemant and my contact phone is +919876543210."
						>
							20 minutes late
						</button>
					</div>

					<div class="scenario-group">
						<p class="scenario-group-label">Support</p>
						<button
							type="button"
							data-prompt="I was charged incorrectly for Max's grooming. My name is Hemant and my contact phone is +919876543210."
						>
							Charge complaint
						</button>
						<button
							type="button"
							data-prompt="I am unhappy with the grooming quality for Max. My name is Hemant and my contact phone is +919876543210."
						>
							Quality complaint
						</button>
						<button
							type="button"
							data-prompt="I have a complaint about the waiting time at my appointment. My name is Hemant and my contact phone is +919876543210."
						>
							Operational complaint
						</button>
						<button
							type="button"
							data-prompt="My dog was injured during grooming. My name is Hemant and my contact phone is +919876543210."
						>
							Safety complaint
						</button>
					</div>
				</div>
			</aside>

			<section class="conversation-panel" aria-labelledby="conversation-title">
				<header class="conversation-header">
					<div>
						<p class="eyebrow">Text channel</p>
						<h2 id="conversation-title">Customer conversation</h2>
					</div>
					<span id="request-status" class="status-badge">Ready</span>
				</header>

				<div id="conversation-log" class="conversation-log" aria-live="polite">
					<article class="message receptionist-message">
						<p class="message-author">Receptionist</p>
						<p>Hello! How can I help with your dog’s grooming today?</p>
					</article>
				</div>

				<form id="message-form" class="message-form">
					<label class="sr-only" for="message">Message</label>
					<textarea
						id="message"
						name="message"
						rows="2"
						maxlength="4000"
						placeholder="Ask about services, hours, or an appointment…"
						required
					></textarea>
					<button id="send-message" class="send-button" type="submit">Send</button>
				</form>
				<p id="conversation-id" class="conversation-id">
					A conversation ID will appear here.
				</p>
			</section>
		</main>

		<script type="module" src="/app.js"></script>
	</body>
</html>
